<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>AI Easy Recipe Generator</title>
</head>
<body>
    <div class="container">
    <header>
        <h1>Sakura's Easy AI Recipe Generator</h1>
    </header>

    <main>
        <div class="form-container">
      <form id="recipe-generator-form">
        <input type="text" placeholder="Enter the dish or drink name."
        autofocus
        required
        autocomplete="off"
        class="dish-input"
        id="user-instructions"
        />
        <input type="submit" class="submit-button"/>
   
    </form>
        
        <div class="hint">i.e: Ramen, Waffles, Fruit Cocktail</div>
      
    
 </div>
    <div class="results hidden" id="results"></div>
    </main>
    <footer>
       <p>This AI project was coded by Sakura T and is open-sourced on <a href="https://github.com/" target="_blank">GitHub</a> and is hosted on <a href="https://easy-ai-recipe-generator.netlify.app/" target="_blank">Netlify</a>.</p>
        <p>© 2026 AI Easy Recipe Generator Project. All rights reserved.</p>
    </footer>
</div>
    <script src="src/index.js"></script>
</body>
</html>
